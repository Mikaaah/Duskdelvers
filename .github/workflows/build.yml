name: Build Duskdelvers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: NeoForge 1.21.1 / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and package
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload compiled mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Duskdelvers-0.2.2-NeoForge-1.21.1
          path: build/libs/duskdelvers-0.2.2.jar
          if-no-files-found: error
